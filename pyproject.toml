[project]
name = "factorio-quality-benchmarker"
version = "0.1.0"
description = "A tool to analyse and compare the best methods for acquiring legendary items in Factorio"
readme = "README.md"
authors = [
    { name = "Max Hawkins", email = "m@ximilian.uk" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "scipy>=1.18.0",
    "typer>=0.27.1",
]

[project.scripts]
factorio-quality-benchmarker = "factorio_quality_benchmarker:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
